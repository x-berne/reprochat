  <script type="module">
    if (!('popover' in HTMLElement.prototype)) {
      import('https://unpkg.com/@oddbird/popover-polyfill@latest/dist/popover.min.js');
    }
  </script>
  <script>
    const sourcesTrigger = document.getElementById('sources-trigger');
    const sourcesPopover = document.getElementById('sources-popover');

    if (sourcesTrigger && sourcesPopover && !window.CSS?.supports?.('position-area', 'block-start')) {
      function positionSourcesPopover() {
        const rect = sourcesTrigger.getBoundingClientRect();
        const popoverWidth = sourcesPopover.offsetWidth || 168;
        const left = Math.min(
          Math.max(8, rect.left + rect.width / 2 - popoverWidth / 2),
          window.innerWidth - popoverWidth - 8
        );
        sourcesPopover.style.left = `${left}px`;
        sourcesPopover.style.bottom = `${window.innerHeight - rect.top + 8}px`;
      }

      sourcesPopover.addEventListener('toggle', (e) => {
        if (e.newState === 'open') {
          positionSourcesPopover();
        }
      });

      window.addEventListener('resize', () => {
        if (sourcesPopover.matches(':popover-open, .\\:popover-open')) {
          positionSourcesPopover();
        }
      });
    }
    const ASK_ENDPOINT = 'https://4n9uyexb.function2.insforge.app/ask';
    const NO_INFO_RESPONSE = 'no tengo esa informacion en mis documentos';
    const chatContainer = document.getElementById('chat-container');
    const chatMain = document.getElementById('chat-main');
    const chatForm = document.getElementById('chat-form');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const headerBrand = document.getElementById('header-brand');
    const initialLoader = document.getElementById('initial-loader');
    const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
    const themeToggle = document.getElementById('theme-toggle');
    const darkSchemeMedia = window.matchMedia('(prefers-color-scheme: dark)');

    function getStoredColorScheme() {
      try {
        return localStorage.getItem('color-scheme');
      } catch {
        return null;
      }
    }

    themeToggle.addEventListener('click', () => {
      const systemScheme = darkSchemeMedia.matches ? 'dark' : 'light';
      const currentMeta = colorSchemeMeta.content;
      const renderedScheme =
        currentMeta === 'light' || currentMeta === 'dark'
          ? currentMeta
          : getStoredColorScheme() ?? systemScheme;
      const targetScheme = renderedScheme === 'dark' ? 'light' : 'dark';

      if (targetScheme !== systemScheme) {
        try {
          localStorage.setItem('color-scheme', targetScheme);
        } catch {}
        colorSchemeMeta.content = targetScheme;
      } else {
        try {
          localStorage.removeItem('color-scheme');
        } catch {}
        colorSchemeMeta.content = 'light dark';
      }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'color-scheme') {
        colorSchemeMeta.content = e.newValue ?? 'light dark';
      }
    });

    let supportsDisplayTransition;
    function canTransitionDisplay() {
      if (supportsDisplayTransition !== undefined) return supportsDisplayTransition;
      if (!window.CSS?.supports?.('transition-behavior', 'allow-discrete') || !document.body) {
        return false;
      }
      const probe = document.createElement('div');
      probe.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
      document.body.appendChild(probe);
      getComputedStyle(probe).display;
      probe.style.display = 'none';
      supportsDisplayTransition = getComputedStyle(probe).display === 'block';
      probe.remove();
      return supportsDisplayTransition;
    }

    async function dismissInitialLoader() {
      if (!initialLoader) return;

      const minDelay = new Promise((resolve) => setTimeout(resolve, 1500));
      const fontsReady = document.fonts?.ready
        ? Promise.race([
            document.fonts.ready,
            new Promise((resolve) => setTimeout(resolve, 1500)),
          ])
        : Promise.resolve();

      await Promise.all([minDelay, fontsReady]);

      if (canTransitionDisplay()) {
        initialLoader.hidden = true;
      } else {
        initialLoader.setAttribute('data-closing', '');
      }

      const animations = initialLoader.getAnimations();
      if (animations.length > 0) {
        await Promise.race([
          Promise.allSettled(animations.map((a) => a.finished)),
          new Promise((resolve) => setTimeout(resolve, 1000)),
        ]);
      }

      initialLoader.remove();
    }

    dismissInitialLoader();

    headerBrand.addEventListener('click', () => {
      document.body.dataset.state = 'welcome';
      chatContainer.innerHTML = '';
      questionInput.value = '';
      questionInput.focus();
    });

    function scrollToBottom() {
      chatMain.scrollTop = chatMain.scrollHeight;
    }

    function isNoInfoResponse(text) {
      if (typeof text !== 'string') return false;
      const normalized = text
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[.!]+$/, '');
      return normalized === NO_INFO_RESPONSE;
    }

    function createStatusIcon(type) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('class', 'status-icon');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');

      if (type === 'warning') {
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z');
        svg.appendChild(path);
      } else {
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', '12');
        circle.setAttribute('cy', '12');
        circle.setAttribute('r', '10');
        svg.appendChild(circle);
      }

      const line1 = document.createElementNS(svgNS, 'line');
      line1.setAttribute('x1', '12');
      line1.setAttribute('y1', type === 'warning' ? '9' : '8');
      line1.setAttribute('x2', '12');
      line1.setAttribute('y2', type === 'warning' ? '13' : '12');
      svg.appendChild(line1);

      const line2 = document.createElementNS(svgNS, 'line');
      line2.setAttribute('x1', '12');
      line2.setAttribute('y1', type === 'warning' ? '17' : '16');
      line2.setAttribute('x2', '12.01');
      line2.setAttribute('y2', type === 'warning' ? '17' : '16');
      svg.appendChild(line2);

      return svg;
    }

    function appendInlineFormatting(parent, text) {
      const tokenRegex = /(\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`\n]+`)/g;
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          parent.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }

        const token = match[0];
        if (token.startsWith('**') && token.endsWith('**')) {
          const strong = document.createElement('strong');
          strong.textContent = token.slice(2, -2);
          parent.appendChild(strong);
        } else if (token.startsWith('*') && token.endsWith('*')) {
          const em = document.createElement('em');
          em.textContent = token.slice(1, -1);
          parent.appendChild(em);
        } else if (token.startsWith('`') && token.endsWith('`')) {
          const code = document.createElement('code');
          code.textContent = token.slice(1, -1);
          parent.appendChild(code);
        }

        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < text.length) {
        parent.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    function renderFormattedText(container, text) {
      const lines = String(text ?? '').replace(/\r\n/g, '\n').split('\n');
      let currentList = null;
      let currentListType = null;
      let paragraphLines = [];

      function flushParagraph() {
        if (paragraphLines.length === 0) return;
        const p = document.createElement('p');
        paragraphLines.forEach((line, idx) => {
          if (idx > 0) p.appendChild(document.createElement('br'));
          appendInlineFormatting(p, line);
        });
        container.appendChild(p);
        paragraphLines = [];
      }

      function flushList() {
        if (currentList) {
          container.appendChild(currentList);
          currentList = null;
          currentListType = null;
        }
      }

      for (const rawLine of lines) {
        const trimmed = rawLine.trim();

        if (!trimmed) {
          flushParagraph();
          flushList();
          continue;
        }

        const ulMatch = trimmed.match(/^[-*•]\s+(.+)$/);
        const olMatch = trimmed.match(/^\d+[.)]\s+(.+)$/);

        if (ulMatch) {
          flushParagraph();
          if (currentListType !== 'ul') {
            flushList();
            currentList = document.createElement('ul');
            currentListType = 'ul';
          }
          const li = document.createElement('li');
          appendInlineFormatting(li, ulMatch[1]);
          currentList.appendChild(li);
        } else if (olMatch) {
          flushParagraph();
          if (currentListType !== 'ol') {
            flushList();
            currentList = document.createElement('ol');
            currentListType = 'ol';
          }
          const li = document.createElement('li');
          appendInlineFormatting(li, olMatch[1]);
          currentList.appendChild(li);
        } else {
          flushList();
          paragraphLines.push(trimmed);
        }
      }

      flushParagraph();
      flushList();
    }

    function appendMessage(role, text, options = {}) {
      const { variant = 'default', onRetry = null } = options;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      if (variant !== 'default') {
        msgDiv.classList.add(`is-${variant}`);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (variant === 'warning' || variant === 'error') {
        bubble.setAttribute('role', variant === 'error' ? 'alert' : 'status');
        bubble.appendChild(createStatusIcon(variant));

        const body = document.createElement('div');
        body.className = 'status-body';

        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        body.appendChild(textSpan);

        if (variant === 'error' && typeof onRetry === 'function') {
          const retryBtn = document.createElement('button');
          retryBtn.type = 'button';
          retryBtn.className = 'retry-btn';
          retryBtn.textContent = 'Reintentar';
          retryBtn.addEventListener('click', () => {
            msgDiv.remove();
            onRetry();
          });
          body.appendChild(retryBtn);
        }

        bubble.appendChild(body);
      } else if (role === 'assistant' && variant === 'default') {
        renderFormattedText(bubble, text);
      } else {
        bubble.textContent = text;
      }

      msgDiv.appendChild(bubble);

      chatContainer.appendChild(msgDiv);
      scrollToBottom();
      return { msgDiv, bubble };
    }

    async function handleSendQuestion(question, { isRetry = false } = {}) {
      const trimmed = question.trim();
      if (!trimmed) return;

      if (document.body.dataset.state === 'welcome') {
        document.body.dataset.state = 'chat';
      }

      questionInput.value = '';
      questionInput.disabled = true;
      sendBtn.disabled = true;

      if (!isRetry) {
        appendMessage('user', trimmed);
      }

      const loadingMsg = appendMessage('assistant', 'Consultando documentos normativos...', {
        variant: 'loading',
      });

      const retryCurrentQuestion = () => handleSendQuestion(trimmed, { isRetry: true });

      try {
        const response = await fetch(ASK_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: trimmed }),
        });

        const data = await response.json();
        loadingMsg.msgDiv.remove();

        if (!response.ok || data.error) {
          appendMessage(
            'assistant',
            `Error al consultar el backend: ${data.error || response.statusText}`,
            { variant: 'error', onRetry: retryCurrentQuestion }
          );
        } else if (isNoInfoResponse(data.answer)) {
          appendMessage(
            'assistant',
            'No tengo esa información en mis documentos. La consulta no figura en el corpus normativo cargado (Ley 27.350, Decreto 883/2020 y Resoluciones 800/2021, 766/2023 y 1780/2025). Prueba con otra consulta.',
            { variant: 'warning' }
          );
        } else {
          appendMessage('assistant', data.answer);
        }
      } catch (err) {
        loadingMsg.msgDiv.remove();
        appendMessage(
          'assistant',
          `Error de conexión: ${err.message || err}`,
          { variant: 'error', onRetry: retryCurrentQuestion }
        );
      } finally {
        questionInput.disabled = false;
        sendBtn.disabled = false;
        questionInput.focus();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleSendQuestion(questionInput.value);
    });

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendQuestion(questionInput.value);
      }
    });

    document.querySelectorAll('.welcome-card').forEach((card) => {
      card.addEventListener('click', () => {
        const question = card.getAttribute('data-question') || card.textContent;
        handleSendQuestion(question);
      });
    });
  </script>
